<h1>hello</h1>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yuki Yunxi Liu</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #060608; }
  #bg { position: fixed; inset: 0; z-index: 0; }
  #three-canvas { position: fixed; inset: 0; z-index: 1; pointer-events: none; }
  #ui { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
  #name {
    position: absolute;
    bottom: 48px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.28);
    font-size: 11px;
    letter-spacing: 0.22em;
    font-family: 'Courier New', monospace;
    text-transform: uppercase;
    animation: breatheText 4s ease-in-out infinite alternate;
  }
  #hint {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.16);
    font-size: 9px;
    letter-spacing: 0.18em;
    font-family: 'Courier New', monospace;
    text-transform: uppercase;
  }
  @keyframes breatheText {
    from { opacity: 0.4; }
    to { opacity: 1; }
  }
  #cursor-glow {
    position: fixed;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
    transform: translate(-50%, -50%);
    mix-blend-mode: screen;
    transition: opacity 0.3s;
    opacity: 0;
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>
<canvas id="three-canvas"></canvas>
<div id="cursor-glow"></div>
<div id="ui">
  <div id="name">Yuki Yunxi Liu</div>
  <div id="hint">touch to enter</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─── Background gradient canvas ───────────────────────────────────
const bg = document.getElementById('bg');
const bgCtx = bg.getContext('2d');

// Color palette — many hues, pairs shift over time
const hues = [
  [18, 72],    // amber + teal
  [260, 45],   // violet + gold
  [340, 160],  // rose + mint
  [200, 30],   // sky + orange
  [140, 300],  // green + purple
  [55, 220],   // yellow + blue
  [10, 190],   // red-orange + cyan
];
let hueIdx = 0;
let hueT = 0;
let hueSpeed = 0.0008;

// Blob positions — move independently
const blobs = [
  { x: 0.2, y: 0.3, vx: 0.0003, vy: 0.0002, r: 0.65 },
  { x: 0.8, y: 0.7, vx: -0.0002, vy: 0.0003, r: 0.55 },
  { x: 0.5, y: 0.5, vx: 0.0001, vy: -0.0002, r: 0.45 },
];

function hslToRgba(h, s, l, a) {
  h = h % 360;
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const c = s * Math.min(l, 1 - l);
  const f = n => l - c * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  return `rgba(${Math.round(f(0)*255)},${Math.round(f(8)*255)},${Math.round(f(4)*255)},${a})`;
}

function lerpAngle(a, b, t) {
  let diff = b - a;
  while (diff > 180) diff -= 360;
  while (diff < -180) diff += 360;
  return a + diff * t;
}

function drawBg(t) {
  const w = bg.width, h = bg.height;
  bgCtx.clearRect(0, 0, w, h);
  bgCtx.fillStyle = '#060608';
  bgCtx.fillRect(0, 0, w, h);

  const curPair = hues[hueIdx % hues.length];
  const nextPair = hues[(hueIdx + 1) % hues.length];
  const tf = hueT;

  const h1 = lerpAngle(curPair[0], nextPair[0], tf);
  const h2 = lerpAngle(curPair[1], nextPair[1], tf);

  // Move blobs
  blobs.forEach((b, i) => {
    b.x += b.vx * (1 + Math.sin(t * 0.3 + i) * 0.5);
    b.y += b.vy * (1 + Math.cos(t * 0.25 + i) * 0.5);
    if (b.x < 0.1 || b.x > 0.9) b.vx *= -1;
    if (b.y < 0.1 || b.y > 0.9) b.vy *= -1;
  });

  const blobHues = [h1, h2, (h1 + h2) / 2];
  blobs.forEach((b, i) => {
    const gx = b.x * w, gy = b.y * h;
    const gr = Math.max(w, h) * b.r;
    const grad = bgCtx.createRadialGradient(gx, gy, 0, gx, gy, gr);
    grad.addColorStop(0, hslToRgba(blobHues[i], 70, 55, 0.22));
    grad.addColorStop(0.5, hslToRgba(blobHues[i], 60, 40, 0.08));
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    bgCtx.fillStyle = grad;
    bgCtx.fillRect(0, 0, w, h);
  });
}

// ─── Three.js crystal stone ────────────────────────────────────────
const threeCanvas = document.getElementById('three-canvas');
const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setClearColor(0x000000, 0);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
camera.position.z = 5.5;

// Build lumpy organic crystal geometry
// Start with icosahedron, then distort heavily for doughy irregular feel
const geo = new THREE.IcosahedronGeometry(1.15, 3);
const posArr = geo.attributes.position;
const originalPositions = [];
for (let i = 0; i < posArr.count; i++) {
  const x = posArr.getX(i), y = posArr.getY(i), z = posArr.getZ(i);
  // Irregular lumpy distortion — bigger bumps
  const len = Math.sqrt(x*x + y*y + z*z);
  const nx = x/len, ny = y/len, nz = z/len;
  const seed = Math.sin(nx * 7.3 + ny * 5.1 + nz * 3.7) * 0.5 +
               Math.sin(nx * 2.1 + ny * 8.4 + nz * 6.2) * 0.3 +
               Math.sin(nx * 11.2 + ny * 3.3 + nz * 9.1) * 0.15;
  const dist = 1.0 + seed * 0.38;
  const fx = x * dist, fy = y * dist, fz = z * dist;
  posArr.setXYZ(i, fx, fy, fz);
  originalPositions.push(fx, fy, fz);
}
posArr.needsUpdate = true;
geo.computeVertexNormals();

const mat = new THREE.MeshPhysicalMaterial({
  color: 0xeef0ff,
  transparent: true,
  opacity: 0.78,
  roughness: 0.04,
  metalness: 0.0,
  transmission: 0.5,
  thickness: 2.0,
  ior: 1.45,
  side: THREE.DoubleSide,
  envMapIntensity: 1.2,
});
const stone = new THREE.Mesh(geo, mat);
scene.add(stone);

// Inner core — slightly different shape
const innerGeo = new THREE.IcosahedronGeometry(0.72, 2);
const innerPos = innerGeo.attributes.position;
for (let i = 0; i < innerPos.count; i++) {
  const x = innerPos.getX(i), y = innerPos.getY(i), z = innerPos.getZ(i);
  const seed = Math.cos(x * 5 + y * 8) * 0.2;
  innerPos.setXYZ(i, x * (1 + seed), y * (1 + seed * 0.5), z * (1 + seed * 0.7));
}
innerPos.needsUpdate = true;
innerGeo.computeVertexNormals();
const innerMat = new THREE.MeshBasicMaterial({ color: 0xdde8ff, transparent: true, opacity: 0.13, side: THREE.BackSide });
const inner = new THREE.Mesh(innerGeo, innerMat);
stone.add(inner);

// Lighting
const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);
const light1 = new THREE.DirectionalLight(0xffffff, 1.6);
light1.position.set(4, 6, 4);
scene.add(light1);
const light2 = new THREE.DirectionalLight(0xb8d4ff, 0.8);
light2.position.set(-5, -3, 2);
scene.add(light2);
const rimLight = new THREE.DirectionalLight(0xffd0e0, 0.4);
rimLight.position.set(0, -5, -3);
scene.add(rimLight);
const pointLight = new THREE.PointLight(0xffffff, 1.2, 12);
pointLight.position.set(0, 0, 4);
scene.add(pointLight);

// ─── DVD bounce state ──────────────────────────────────────────────
const W = () => window.innerWidth;
const H = () => window.innerHeight;

// Position in screen pixels
let px = W() / 2, py = H() / 2;
// Speed in pixels per frame — DVD feel
let dvdVx = 2.1, dvdVy = 1.5;
const stoneScreenR = 90; // approx radius in pixels for bounce boundary

// ─── Squish / morph (rubber + dough) ──────────────────────────────
let squishX = 1, squishY = 1, squishZ = 1;
let squishVx = 0, squishVy = 0, squishVz = 0;

function applySquish(axis, amount) {
  // Conservation of volume: squish one axis, expand others
  if (axis === 'x') { squishVx += amount; squishVy -= amount * 0.5; squishVz -= amount * 0.5; }
  if (axis === 'y') { squishVy += amount; squishVx -= amount * 0.5; squishVz -= amount * 0.5; }
}

// ─── Mouse ─────────────────────────────────────────────────────────
let mouseX = -9999, mouseY = -9999;
let isHover = false;
const cursorGlow = document.getElementById('cursor-glow');

window.addEventListener('mousemove', (e) => {
  mouseX = e.clientX; mouseY = e.clientY;
  cursorGlow.style.left = mouseX + 'px';
  cursorGlow.style.top = mouseY + 'px';
  cursorGlow.style.opacity = '1';
  const dist = Math.sqrt((mouseX - px) ** 2 + (mouseY - py) ** 2);
  isHover = dist < stoneScreenR * 1.3;
});

window.addEventListener('click', (e) => {
  const dist = Math.sqrt((e.clientX - px) ** 2 + (e.clientY - py) ** 2);
  if (dist < stoneScreenR * 1.5) {
    // Big squish on click
    applySquish('x', 0.4);
    setTimeout(() => applySquish('y', 0.3), 80);
  }
});

window.addEventListener('mouseleave', () => { cursorGlow.style.opacity = '0'; isHover = false; });

// ─── Resize ────────────────────────────────────────────────────────
function resize() {
  bg.width = window.innerWidth; bg.height = window.innerHeight;
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
resize();
window.addEventListener('resize', resize);

// ─── Convert screen px to Three.js world coords ───────────────────
function screenToWorld(sx, sy) {
  const ndcX = (sx / window.innerWidth) * 2 - 1;
  const ndcY = -(sy / window.innerHeight) * 2 + 1;
  // At z=0 plane from camera at z=5.5
  const fovRad = camera.fov * Math.PI / 180;
  const halfH = Math.tan(fovRad / 2) * camera.position.z;
  const halfW = halfH * camera.aspect;
  return { x: ndcX * halfW, y: ndcY * halfH };
}

// ─── Main loop ─────────────────────────────────────────────────────
let t = 0;
let rotY = 0, rotX = 0, rotZ = 0;
let targetScale = 1.0, currentScale = 1.0;

// Morph wobble — organic breathing
let wobbleT = 0;

function animate() {
  requestAnimationFrame(animate);
  t += 0.016;
  wobbleT += 0.018;
  hueT += hueSpeed;
  if (hueT >= 1) { hueT = 0; hueIdx = (hueIdx + 1) % hues.length; }

  // Background
  drawBg(t);

  // Cursor glow color from current hue
  const curPair = hues[hueIdx % hues.length];
  const glowHue = curPair[0];
  cursorGlow.style.background = `radial-gradient(circle, hsla(${glowHue},80%,65%,0.35) 0%, transparent 70%)`;

  // ── DVD bounce ──
  px += dvdVx;
  py += dvdVy;
  let bounced = false;
  if (px < stoneScreenR) { px = stoneScreenR; dvdVx = Math.abs(dvdVx); applySquish('x', -0.35); bounced = true; }
  if (px > W() - stoneScreenR) { px = W() - stoneScreenR; dvdVx = -Math.abs(dvdVx); applySquish('x', -0.35); bounced = true; }
  if (py < stoneScreenR) { py = stoneScreenR; dvdVy = Math.abs(dvdVy); applySquish('y', -0.35); bounced = true; }
  if (py > H() - stoneScreenR) { py = H() - stoneScreenR; dvdVy = -Math.abs(dvdVy); applySquish('y', -0.35); bounced = true; }

  // ── Squish spring physics ──
  const k = 0.18, damp = 0.72;
  squishVx += (-squishVx + (1 - squishX)) * k; squishX += squishVx; squishVx *= damp;
  squishVy += (-squishVy + (1 - squishY)) * k; squishY += squishVy; squishVy *= damp;
  squishVz += (-squishVz + (1 - squishZ)) * k; squishZ += squishVz; squishVz *= damp;

  // ── Organic vertex wobble (dough/rubber feel) ──
  const vp = geo.attributes.position;
  for (let i = 0; i < vp.count; i++) {
    const ox = originalPositions[i * 3];
    const oy = originalPositions[i * 3 + 1];
    const oz = originalPositions[i * 3 + 2];
    const wob = Math.sin(wobbleT * 1.3 + ox * 3.1 + oy * 2.7) * 0.035
              + Math.cos(wobbleT * 0.9 + oy * 4.2 + oz * 1.8) * 0.025
              + Math.sin(wobbleT * 2.1 + oz * 2.5 + ox * 1.4) * 0.015;
    vp.setXYZ(i, ox + wob * ox * 0.3, oy + wob * oy * 0.3, oz + wob * oz * 0.3);
  }
  vp.needsUpdate = true;
  geo.computeVertexNormals();

  // ── Stone world position ──
  const wpos = screenToWorld(px, py);
  stone.position.x = wpos.x;
  stone.position.y = wpos.y;

  // ── Scale: hover expands + squish ──
  targetScale = isHover ? 1.18 : 1.0;
  currentScale += (targetScale - currentScale) * 0.07;
  stone.scale.set(
    currentScale * (1 + squishX - 1),
    currentScale * (1 + squishY - 1),
    currentScale * (1 + squishZ - 1)
  );

  // ── Fast rotation ~10s per revolution ──
  rotY += (2 * Math.PI) / (10 * 60); // 10s at 60fps
  rotX += 0.0018;
  rotZ += Math.sin(t * 0.3) * 0.001;
  stone.rotation.set(rotX, rotY, rotZ);

  // ── Opacity breathing ──
  mat.opacity = 0.72 + Math.sin(t * 0.7) * 0.06;

  // ── Light follows stone loosely ──
  light1.position.x = wpos.x + 3 + Math.sin(t * 0.4) * 1.5;
  light1.position.y = wpos.y + 4 + Math.cos(t * 0.35) * 1.5;
  pointLight.position.x = wpos.x;
  pointLight.position.y = wpos.y;

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
